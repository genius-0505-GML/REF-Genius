<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALORANT Database</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shell.css"><script src="../icons.js"></script>
<script src="../shell.js"></script>
</head>
<body>
<header class="topbar">
  <a class="logo" href="#" data-nav="home">VALORANT <span></span></a>
  <button id="menuBtn" class="icon-btn menu-btn" aria-label="Menu">☰</button>
  <nav id="nav">
    <a href="#" data-nav="home">Home</a>
    <a href="#" data-nav="agents">Agentes</a>
    <a href="#" data-nav="abilities">Habilidades</a>
    <a href="#" data-nav="weapons">Armas</a>
    <a href="#" data-nav="teams">Times</a>
    <a href="#" data-nav="favs">Favoritos</a>
  </nav>
  <input id="globalSearch" type="search" placeholder="🔎 Pesquisar..." autocomplete="off">
  <button id="themeBtn" class="icon-btn"></button>
</header>

<main>
  <section id="search" class="view hidden">
    <h2 class="title">RESULTADOS DA BUSCA</h2>
    <div id="searchResults"></div>
  </section>

  <section id="home" class="view">
    <div class="hero compact">
      <h1>VALORANT <span></span></h1>
      <p>Explore os agentes, habilidades e armas de VALORANT.</p>
    </div>
    <h2 class="title">AGENTES</h2>
    <div id="homeGrid" class="pgrid"></div>
  </section>

  <section id="agents" class="view hidden">
    <h2 class="title">AGENTES</h2>
    <div class="toolbar">
      <div id="roleFilters" class="chips"></div>
      <input id="agentSearch" type="search" placeholder="Buscar agente por nome...">
    </div>
    <div id="agentGrid" class="grid"></div>
  </section>

  <section id="abilities" class="view hidden">
    <h2 class="title">HABILIDADES</h2>
    <div class="toolbar">
      <input id="abilitySearch" type="search" placeholder="Ex.: Dash, Smoke, Flash, Recon Bolt, Hunter's Fury">
    </div>
    <div id="abilityGrid" class="grid ab-grid"></div>
  </section>

  <section id="weapons" class="view hidden">
    <h2 class="title">ARMAS</h2>
    <div class="toolbar">
      <div id="catFilters" class="chips"></div>
      <input id="weaponSearch" type="search" placeholder="Buscar arma por nome...">
    </div>
    <div id="weaponGrid"></div>
    <h2 class="title" id="compare">COMPARAR ARMAS</h2>
    <div class="compare-sel">
      <select id="cmpA"></select>
      <span>vs</span>
      <select id="cmpB"></select>
    </div>
    <div id="cmpResult" class="table-wrap"></div>
  </section>

  <section id="teams" class="view hidden">
    <h2 class="title">MONTAR TIME</h2>
    <div class="team-builder">
      <div class="toolbar">
        <input id="teamName" type="text" placeholder="Nome do time (ex.: Time Ranked)" maxlength="40" autocomplete="off">
        <span id="editBadge" class="key hidden">EDITANDO</span>
      </div>

      <h3 class="cat-title">AGENTES <span id="agentCount" class="muted">(0/5)</span></h3>
      <div id="teamSlots" class="team-slots"></div>
      <div id="teamRoles" class="chips team-roles"></div>
      <div class="toolbar">
        <input id="pickAgentSearch" type="search" placeholder="Filtrar agentes...">
      </div>
      <div id="pickAgents" class="pick-grid"></div>

      <h3 class="cat-title">MAPAS <span id="mapCount" class="muted">(0)</span></h3>
      <div id="pickMaps" class="pick-grid map-grid"></div>

      <div class="team-actions">
        <button id="saveTeam" class="btn">💾 Salvar time</button>
        <button id="clearTeam" class="btn ghost">Limpar</button>
      </div>
      <p id="teamMsg" class="muted"></p>
    </div>

    <h2 class="title">TIMES SALVOS</h2>
    <div id="savedTeams" class="grid team-list"></div>
  </section>

  <section id="favs" class="view hidden">
    <h2 class="title">❤️ MEUS FAVORITOS</h2>
    <div id="favContent"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="icon-btn close" aria-label="Fechar">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
